            font-family: system-ui, -apple-system, sans-serif;
            max-width: 420px;
            margin: 0 auto;
            padding: 20px 16px 40px;
            text-align: center;
            background: #f7f2e9;
            color: #2c2416;
            line-height: 1.5;
        }

        #refsDisplay {
            font-size: 1.6rem;
            font-weight: bold;
            color: #8b5a2b;
            background: white;
            padding: 20px 16px;
            border-radius: 14px;
            margin: 18px 0;
            border: 1px solid #e6dccb;
            line-height: 1.35;
        }

        button {
            font-size: 1.1rem;
            padding: 14px 32px;
            margin: 10px 6px;
            border-radius: 12px;
            border: none;
            background: #8b5a2b;
            color: white;
            cursor: pointer;
            min-width: 110px;
        }
        
        button:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        label {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            font-size: 1.15rem;
            cursor: pointer;
            margin: 18px 0;
            padding: 10px;
            user-select: none;
        }

        input[type="checkbox"] {
            width: 22px;
            height: 22px;
            accent-color: #8b5a2b;
        }

        .progress-bar-wrap {
            background: #e6dccb;
            border-radius: 999px;
            height: 10px;
            overflow: hidden;
            margin: 16px 0 6px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #8b5a2b;
            border-radius: 999px;
            transition: width 0.3s ease;
        }

        #progressText {
            font-size: 0.9rem;
            color: #6b5e4a;
            margin-bottom: 20px;
        }
    </style>

        let currentDay = 1;
        let completed = new Set();

        function saveProgress() {
            localStorage.setItem("chronoKJV", JSON.stringify({
                currentDay: currentDay,
                completed: [...completed]
            }));
        }

        function loadProgress() {
            const saved = localStorage.getItem("chronoKJV");
            if (saved) {
                const data = JSON.parse(saved);
                currentDay = data.currentDay || 1;
                completed = new Set(data.completed || []);
            }
        }

        function updateUI() {
            document.getElementById("dayDisplay").textContent = "Day " + currentDay + " of " + PLAN.length;
            document.getElementById("refsDisplay").textContent = PLAN[currentDay - 1];
            document.getElementById("completeCheck").checked = completed.has(currentDay);
            document.getElementById("nextBtn").disabled = !completed.has(currentDay) || currentDay === PLAN.length;
            document.getElementById("prevBtn").disabled = currentDay === 1;
            
            const percent = (completed.size / PLAN.length) * 100;
            document.getElementById("progressBar").style.width = percent + "%";
            document.getElementById("progressText").textContent = completed.size + " of " + PLAN.length + " days completed";
        }

        document.getElementById("completeCheck").addEventListener("change", function() {
            if (this.checked) {
                completed.add(currentDay);
            } else {
                completed.delete(currentDay);
            }
            saveProgress();
            updateUI();
        });

        document.getElementById("prevBtn").addEventListener("click", function() {
            if (currentDay > 1) {
                currentDay = currentDay - 1;
                saveProgress();
                updateUI();
            }
        });

        document.getElementById("nextBtn").addEventListener("click", function(){
            if (completed.has(currentDay) && currentDay < PLAN.length) {
                currentDay = currentDay + 1;
                saveProgress();
                updateUI();
            }
        });

        loadProgress();
        updateUI();
